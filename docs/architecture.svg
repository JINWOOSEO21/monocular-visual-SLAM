<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" width="1300" height="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>System architecture: Raspberry Pi 4B sensor and motor stack, PC SLAM stack</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .hw    { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
      .node  { fill: #ffffff; stroke: #334155; stroke-width: 1.4; }
      .topic { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .name  { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .sub   { font-size: 11px; fill: #64748b; text-anchor: middle; dominant-baseline: central; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl   { font-size: 11px; fill: #475569; text-anchor: middle;
               paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .lbl-l { text-anchor: start; }
      .edge  { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
      .fb    { stroke-dasharray: 5 4; }
      .title { font-size: 17px; font-weight: 700; }
      .cap   { font-size: 12px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1300" height="500" rx="14" fill="#ffffff"/>

  <!-- panels -->
  <rect x="20" y="20" width="940" height="420" rx="12" fill="#fdf2f5" stroke="#c51a4a" stroke-width="1.5"/>
  <text x="44" y="50" class="title" fill="#a3153c">Raspberry Pi 4B</text>
  <text x="190" y="50" class="cap">sensors · EKF · motor control</text>

  <rect x="1030" y="20" width="250" height="420" rx="12" fill="#eff5fc" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="1054" y="50" class="title" fill="#1e4e8c">PC</text>
  <text x="1086" y="50" class="cap">SLAM</text>

  <line x1="995" y1="62" x2="995" y2="430" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="995" y="50" class="lbl" font-weight="600">Wi-Fi</text>
  <text x="995" y="66" class="lbl" font-size="10">ROS 2 DDS</text>

  <!-- row 1: camera -->
  <rect x="44" y="72" width="116" height="46" rx="8" class="hw"/>
  <text x="102" y="95" class="name">IMX219</text>
  <rect x="230" y="72" width="170" height="46" rx="8" class="node"/>
  <text x="315" y="95" class="name mono">camera_ros</text>
  <path d="M160,95 H228" class="edge"/>
  <text x="195" y="88" class="lbl">CSI</text>
  <path d="M400,95 H1058" class="edge"/>
  <text x="600" y="88" class="lbl mono">/camera/image_raw/compressed</text>
  <text x="600" y="110" class="lbl" font-size="10">JPEG, 15 Hz</text>

  <!-- row 2: IMU -->
  <rect x="44" y="162" width="116" height="46" rx="8" class="hw"/>
  <text x="102" y="185" class="name">MPU6050</text>
  <rect x="230" y="162" width="170" height="46" rx="8" class="node"/>
  <text x="315" y="185" class="name mono">mpu6050_node</text>
  <rect x="520" y="162" width="150" height="46" rx="8" class="node"/>
  <text x="595" y="185" class="name mono">imu_kalman_node</text>
  <path d="M160,185 H228" class="edge"/>
  <text x="195" y="178" class="lbl">I2C</text>
  <path d="M400,185 H518" class="edge"/>
  <text x="460" y="178" class="lbl mono">/imu/data_raw</text>
  <path d="M670,185 H860 V241" class="edge"/>
  <text x="765" y="178" class="lbl mono">/imu/data</text>

  <!-- row 3: encoders -->
  <rect x="44" y="252" width="116" height="46" rx="8" class="hw"/>
  <text x="102" y="275" class="name">Encoders ×2</text>
  <rect x="230" y="252" width="170" height="46" rx="8" class="node"/>
  <text x="315" y="275" class="name mono">encoder_node</text>
  <rect x="520" y="252" width="150" height="46" rx="8" class="node"/>
  <text x="595" y="275" class="name mono">odometry_node</text>
  <path d="M160,275 H228" class="edge"/>
  <text x="195" y="268" class="lbl">GPIO</text>
  <path d="M400,275 H518" class="edge"/>
  <text x="460" y="268" class="lbl mono">/encoder/ticks</text>
  <path d="M670,275 H788" class="edge"/>
  <text x="729" y="268" class="lbl mono">/odom</text>

  <!-- EKF -->
  <rect x="790" y="243" width="140" height="64" rx="8" class="node"/>
  <text x="860" y="266" class="name mono" font-size="13">robot_localization</text>
  <text x="860" y="287" class="name">EKF</text>
  <path d="M930,275 H1058" class="edge"/>
  <text x="995" y="267" class="lbl mono" font-size="10.5">/odometry/filtered</text>
  <text x="995" y="292" class="lbl mono" font-size="10.5">TF odom→base_link</text>

  <!-- row 4: motors -->
  <rect x="44" y="362" width="116" height="46" rx="8" class="topic"/>
  <text x="102" y="385" class="name mono" font-weight="500">/cmd_vel</text>
  <rect x="230" y="362" width="170" height="46" rx="8" class="node"/>
  <text x="315" y="378" class="name mono">pid_controller_node</text>
  <text x="315" y="396" class="sub mono">or motor_driver_node</text>
  <rect x="520" y="362" width="150" height="46" rx="8" class="hw"/>
  <text x="595" y="385" class="name">L298N</text>
  <rect x="790" y="362" width="140" height="46" rx="8" class="hw"/>
  <text x="860" y="385" class="name">Motors ×2</text>
  <path d="M160,385 H228" class="edge"/>
  <path d="M400,385 H518" class="edge"/>
  <text x="460" y="378" class="lbl">PWM</text>
  <path d="M670,385 H788" class="edge"/>
  <path d="M315,298 V360" class="edge fb"/>
  <text x="325" y="333" class="lbl lbl-l mono">/encoder/ticks</text>

  <!-- PC -->
  <rect x="1060" y="72" width="190" height="46" rx="8" class="node"/>
  <text x="1155" y="88" class="name mono" font-size="13">image_transport</text>
  <text x="1155" y="105" class="sub mono">republish</text>
  <path d="M1100,118 V160" class="edge"/>
  <text x="1110" y="143" class="lbl lbl-l mono" font-size="10.5">/camera/image_decompressed</text>
  <rect x="1060" y="162" width="190" height="46" rx="8" class="node"/>
  <text x="1155" y="178" class="name mono">mono_node</text>
  <text x="1155" y="196" class="sub">ORB-SLAM3 monocular</text>
  <path d="M1100,208 V250" class="edge"/>
  <text x="1110" y="233" class="lbl lbl-l mono" font-size="10.5">/orb_slam3/camera_pose</text>
  <rect x="1060" y="252" width="190" height="46" rx="8" class="node"/>
  <text x="1155" y="275" class="name mono">scale_aligner</text>
  <path d="M1155,298 V332" class="edge"/>
  <text x="1155" y="350" class="lbl mono" font-size="11.5">TF map→odom</text>
  <text x="1155" y="368" class="lbl mono" font-size="11.5">/orb_slam3/odometry</text>

  <!-- legend -->
  <rect x="44" y="460" width="22" height="14" rx="3" class="hw"/>
  <text x="74" y="471" class="cap">hardware</text>
  <rect x="150" y="460" width="22" height="14" rx="3" class="node"/>
  <text x="180" y="471" class="cap">ROS 2 node</text>
  <text x="270" y="471" class="cap mono" fill="#475569">/topic</text>
  <text x="318" y="471" class="cap">topic on an edge</text>
  <path d="M440,467 H480" class="edge fb"/>
  <text x="490" y="471" class="cap">feedback</text>
</svg>
